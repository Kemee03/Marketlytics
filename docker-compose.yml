services:
  db:
    image: postgres:18.6
    container_name: marketlytics-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PGDATABASE:-marketlytics}
      POSTGRES_USER: ${PGUSER:-marketlytics}
      POSTGRES_PASSWORD: ${PGPASSWORD:?Set PGPASSWORD in .env before starting PostgreSQL}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - marketlytics_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-marketlytics} -d ${PGDATABASE:-marketlytics}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  marketlytics_pgdata:
